name: CI

# Lint, byte-compile, and run the CPU-only synthetic smoke suite. No GPU, no
# network access to data sources — the synthetic pipeline is the contract test
# (BUILD_PLAN §5). B5 may extend the test bodies; B0 owns this workflow file.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint + compile + cpu-smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU torch + core + dev
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src tests scripts

      - name: Black (format check)
        run: black --check src tests scripts

      - name: Byte-compile all sources
        run: python -m compileall -q src tests scripts

      - name: Import smoke check
        run: |
          python -c "import cloudremoval; print('cloudremoval', cloudremoval.__version__)"
          python -c "from cloudremoval import build_model, Config, BaseCloudRemovalModel"
          python -c "from cloudremoval.models.registry import list_models; print('models:', list_models())"

      - name: CLI help
        run: python -m cloudremoval.cli --help

      - name: Pytest (CPU, synthetic)
        env:
          CLOUDREMOVAL_LOG: WARNING
        run: pytest -q
